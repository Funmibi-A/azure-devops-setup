
trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Python312:
      python.version: '3.12'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
      architecture: 'x64'
    displayName: 'Use Python $(python.version)'

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install dependencies'

  - script: |
      python -m pytest -v
    displayName: 'Run automated tests'

  - script: |
      mkdir -p "$(Build.ArtifactStagingDirectory)/python-app"
      cp app.py requirements.txt README.md "$(Build.ArtifactStagingDirectory)/python-app/"
    displayName: 'Prepare application artifact'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/python-app'
      artifact: 'python-app'
      publishLocation: 'pipeline'
    displayName: 'Publish Python application artifact'
